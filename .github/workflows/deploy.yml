name: Build and deploy
on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # Full history: the build derives its "Recently finished" list from state
      # transitions in git log; the default depth-1 clone would silently empty it.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Build site
        run: |
          pip install --quiet pyyaml
          python3 build/build.py
          python3 build/obligations.py

      - name: Check for unrendered placeholders
        run: |
          if grep -qE '\{\{[A-Z]+\}\}' public/index.html public/obligations/index.html; then
            echo "::error::Unrendered placeholders in output"; exit 1
          fi

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: makehaven-process-registry
          channelId: live
          # Pinned 2026-11-17: firebase-tools 15.34.1+ first asks Service Usage whether
          # Hosting is enabled, and the deploy service account lacks
          # serviceusage.services.get, so every deploy from 10-22 to 11-09 failed 403.
          # Unpin after granting the account roles/serviceusage.serviceUsageConsumer.
          firebaseToolsVersion: 15.34.0
