# MakeHaven obligations register — machine-readable source.
#
# build/obligations.py renders this to public/obligations/index.html. The
# narrative companion with history and runbook detail is data/obligations.md.
# Keep credentials OUT of this file: it publishes to a public page.
#
# Fields
#   id          stable slug
#   name        what a successor would call it
#   group       tax | insurance | money   (one timeline lane each)
#   cadence     annual | semimonthly | quarterly | once | every-4-years | ongoing
#   due         annual: "MM-DD"  once: "YYYY-MM-DD"  every-4-years: "YYYY-MM-DD" (last)
#               semimonthly: "1,15"  quarterly: "quarter-end"  ongoing: null
#               An annual value of "~MM" means "sometime that month, exact day
#               set by the sender" and renders on the 15th.
#   start_days  how many days before `due` the working window opens
#   owner       who does it
#   state       current | due-soon | at-risk | unresolved | unverified | changing
#               (due-soon is computed from dates; the others are set here)
#   evidence    what proves the last cycle closed, or null if nothing was found
#   if_slips    consequence, one line
#   note        one line for the table; runbook detail stays in obligations.md
#   auto        true if software prepares the work and a person only signs off

